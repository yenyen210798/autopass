<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator UserID & Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

h2{
    color:#fff;
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    color:#fff;
    margin-bottom:8px;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.12);
    color:#fff;
    outline:none;
    margin-bottom:15px;
}

input::placeholder{
    color:#bbb;
}

.password-box{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.password-box input{
    margin-bottom:0;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:#fff;
    font-size:15px;
    font-weight:600;
    margin-top:10px;
}

.generate{
    background:linear-gradient(135deg,#06b6d4,#3b82f6);
}

.copy{
    background:linear-gradient(135deg,#22c55e,#16a34a);
}

textarea{
    width:100%;
    min-height:140px;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    resize:none;
    background:rgba(255,255,255,.12);
    color:#fff;
    outline:none;
}

.info{
    text-align:center;
    color:#cbd5e1;
    font-size:13px;
    margin-top:12px;
}
</style>
</head>
<body>

<div class="card">

    <h2>🔐 Generator Login</h2>

    <label>UserID</label>
    <input
        type="text"
        id="userid"
        placeholder="Masukkan UserID">

    <label>Password</label>

    <div class="password-box">
        <input
            type="text"
            id="password"
            readonly
            placeholder="Generate Password">
    </div>

    <button class="btn generate" onclick="generatePassword()">
        Generate Password
    </button>

    <textarea
        id="preview"
        readonly
        placeholder="Preview pesan akan muncul di sini..."></textarea>

    <button class="btn copy" onclick="copyMessage()">
        Salin Pesan
    </button>

    <div class="info">
        Isi UserID lalu Generate Password
    </div>

</div>

<script>

function generatePassword(){

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

    let password = "";

    for(let i=0;i<8;i++){
        password += chars.charAt(
            Math.floor(Math.random()*chars.length)
        );
    }

    document.getElementById("password").value = password;

    updatePreview();
}

document.getElementById("userid")
.addEventListener("input", updatePreview);

function updatePreview(){

    const userid =
    document.getElementById("userid").value;

    const password =
    document.getElementById("password").value;

    document.getElementById("preview").value =
`userID : ${userid}
password : ${password}

silahkan di coba login dan di ganti passwordnya ya bosku`;
}

function copyMessage(){

    const userid =
    document.getElementById("userid").value;

    if(userid.trim() === ""){
        alert("Masukkan UserID terlebih dahulu!");
        return;
    }

    const text =
    document.getElementById("preview").value;

    navigator.clipboard.writeText(text);

    alert("Pesan berhasil disalin!");
}

generatePassword();

</script>

</body>
</html>
