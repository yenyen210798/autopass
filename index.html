<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:#00d4ff;
    border-radius:50%;
    filter:blur(120px);
    top:-100px;
    left:-100px;
    opacity:.4;
}

body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:#ff00c8;
    border-radius:50%;
    filter:blur(120px);
    bottom:-100px;
    right:-100px;
    opacity:.4;
}

.container{
    position:relative;
    width:420px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.container h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

.password-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.password-box input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:16px;
    outline:none;
}

.copy-btn{
    width:55px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#00d4ff;
    color:#000;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.copy-btn:hover{
    transform:scale(1.05);
}

.options{
    margin:20px 0;
}

.option{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
    margin-bottom:12px;
}

.option input[type="checkbox"]{
    width:18px;
    height:18px;
}

.length-box{
    margin-bottom:20px;
}

.length-box label{
    color:white;
    display:block;
    margin-bottom:10px;
}

.length-box input{
    width:100%;
}

.generate-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#00d4ff,#3b82f6);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.generate-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,212,255,.3);
}

.info{
    margin-top:15px;
    text-align:center;
    color:#d1d5db;
    font-size:13px;
}
</style>
</head>
<body>

<div class="container">
    <h2>🔐 Password Generator</h2>

    <div class="password-box">
        <input type="text" id="password" readonly>
        <button class="copy-btn" onclick="copyPassword()">📋</button>
    </div>

    <div class="length-box">
        <label>Panjang Password: <span id="lengthValue">16</span></label>
        <input type="range" min="6" max="50" value="16" id="length">
    </div>

    <div class="options">
        <div class="option">
            <span>Huruf Besar (A-Z)</span>
            <input type="checkbox" id="uppercase" checked>
        </div>

        <div class="option">
            <span>Huruf Kecil (a-z)</span>
            <input type="checkbox" id="lowercase" checked>
        </div>

        <div class="option">
            <span>Angka (0-9)</span>
            <input type="checkbox" id="numbers" checked>
        </div>

        <div class="option">
            <span>Simbol (!@#$%)</span>
            <input type="checkbox" id="symbols" checked>
        </div>
    </div>

    <button class="generate-btn" onclick="generatePassword()">
        Generate Password
    </button>

    <div class="info">
        Password aman dan dibuat secara acak.
    </div>
</div>

<script>

const lengthSlider = document.getElementById("length");
const lengthValue = document.getElementById("lengthValue");

lengthSlider.addEventListener("input",()=>{
    lengthValue.textContent = lengthSlider.value;
});

function generatePassword(){

    const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lowercase = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+-=[]{}<>?";

    let chars = "";

    if(document.getElementById("uppercase").checked)
        chars += uppercase;

    if(document.getElementById("lowercase").checked)
        chars += lowercase;

    if(document.getElementById("numbers").checked)
        chars += numbers;

    if(document.getElementById("symbols").checked)
        chars += symbols;

    if(chars === ""){
        alert("Pilih minimal satu opsi karakter!");
        return;
    }

    let password = "";
    const length = parseInt(lengthSlider.value);

    for(let i=0;i<length;i++){
        password += chars.charAt(
            Math.floor(Math.random()*chars.length)
        );
    }

    document.getElementById("password").value = password;
}

function copyPassword(){

    const password = document.getElementById("password");

    if(password.value === ""){
        alert("Generate password terlebih dahulu!");
        return;
    }

    navigator.clipboard.writeText(password.value);

    alert("Password berhasil disalin!");
}

generatePassword();

</script>

</body>
</html>
